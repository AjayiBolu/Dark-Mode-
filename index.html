<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Toggle</title>
  <link rel="stylesheet" href="style.css">
  <!-- Apply the saved theme before the page paints to avoid a flash -->
  <script>
    try {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    } catch (e) {}
  </script>
</head>
<body>
  <header class="header">
    <h1>Dark Mode Assignment</h1>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
      <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
      <span class="theme-toggle__label">Dark mode</span>
    </button>
  </header>
<!--Filler content to explain how the toogle works -->
  <main class="content">
    <section class="card">
      <h2>Hello there!</h2>
      <p>
        Click the button in the top-right corner to switch between light and dark mode.
      </p>
      <a href="https://www.linkedin.com/in/israelajayibolu/" class="link">LinkedIn</a>
    </section>
  </main>

 <!-- Calling the script that was made which contains the theme toggle logic -->
  <script src="script.js"></script>
</body>
</html>
